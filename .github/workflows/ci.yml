name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same ref cancels the run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  quality:
    name: Quality (Py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares >=3.11; day-to-day development happens on 3.13.
        # Running both keeps the declared floor honest.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compileall
        run: python -m compileall -q ies_bot_skeleton tests scripts

      - name: Ruff
        run: python -m ruff check --output-format=github .

      - name: Black
        run: python -m black --check .

      - name: Pytest
        run: python -m pytest -q tests

  web-smoke:
    name: Web smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run web smoke checks
        run: python scripts/web_smoke.py

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t ies-web:ci .

  package:
    name: Package build
    runs-on: ubuntu-latest
    needs:
      - quality
      - web-smoke
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build wheel setuptools

      - name: Build package
        run: python -m build --no-isolation

      - name: Verify the wheel stays web-only
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          # The 2026 flow is web-only. These CLI entry points were removed on
          # purpose, so their return would be a regression, not a feature.
          forbidden_paths = [
              Path("ies_bot_skeleton/cli.py"),
              Path("ies_bot_skeleton/entrypoints.py"),
              Path("ies.py"),
              Path("main.py"),
              Path("ies_bot_skeleton/online"),
              Path("ies_bot_skeleton/offline"),
              Path("ies_bot_skeleton/lot_tool"),
              Path("ies_bot_skeleton/compat"),
          ]
          existing = [str(path) for path in forbidden_paths if path.exists()]
          if existing:
              raise SystemExit(f"Legacy runtime paths still exist: {existing}")

          wheels = sorted(Path("dist").glob("*.whl"))
          if not wheels:
              raise SystemExit("Wheel was not built")

          with zipfile.ZipFile(wheels[-1]) as archive:
              entry_points = [n for n in archive.namelist() if n.endswith("entry_points.txt")]
              if entry_points:
                  text = archive.read(entry_points[0]).decode("utf-8")
                  for script_name in ("ies-online", "ies-lottool", "ies-fill-lots", "ies-web"):
                      if script_name in text:
                          raise SystemExit(
                              f"Legacy console script '{script_name}' still in wheel metadata"
                          )
          PY

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
