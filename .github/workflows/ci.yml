name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  LEGACY_UI_TESTS: >-
    tests/test_web_contract_upgrade.py
    tests/test_web_dashboard_focus.py
    tests/test_web_lot_editor_validation.py
    tests/test_web_navigation.py
    tests/test_web_portfolio.py
    tests/test_web_ux_polish.py

jobs:
  quality:
    name: Quality (Py3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compileall
        run: python -m compileall -q ies_bot_skeleton tests scripts

      - name: Ruff
        run: python -m ruff check .

      - name: Pytest
        run: |
          python -m pytest -q tests \
            --ignore=tests/test_web_contract_upgrade.py \
            --ignore=tests/test_web_dashboard_focus.py \
            --ignore=tests/test_web_lot_editor_validation.py \
            --ignore=tests/test_web_navigation.py \
            --ignore=tests/test_web_portfolio.py \
            --ignore=tests/test_web_ux_polish.py

      - name: Legacy UI contract tests (advisory)
        # Эти UX/contract-спеки сейчас описывают старый интерфейс и не
        # совпадают с поддерживаемым web-only продуктом. Держим их как
        # advisory-сигнал, но не блокируем релизы, пока набор не будет
        # синхронизирован с текущим UI.
        continue-on-error: true
        run: python -m pytest -q $LEGACY_UI_TESTS

      - name: Black (advisory)
        # Текущее форматирование не полностью выровнено во всём репозитории.
        # Этот шаг оставлен как advisory, чтобы CI не был шумно красным.
        continue-on-error: true
        run: python -m black --check .

  web-smoke:
    name: Web Smoke (Py3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run web smoke checks
        run: python scripts/web_smoke.py

  package:
    name: Package Build
    runs-on: ubuntu-latest
    needs:
      - quality
      - web-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build wheel setuptools

      - name: Build package
        run: python -m build --no-isolation

      - name: Verify web-only package
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          forbidden_paths = [
              Path("ies_bot_skeleton/cli.py"),
              Path("ies_bot_skeleton/entrypoints.py"),
              Path("ies.py"),
              Path("main.py"),
              Path("ies_bot_skeleton/online"),
              Path("ies_bot_skeleton/offline"),
              Path("ies_bot_skeleton/lot_tool"),
              Path("ies_bot_skeleton/compat"),
          ]
          existing = [str(path) for path in forbidden_paths if path.exists()]
          if existing:
              raise SystemExit(f"Legacy runtime paths still exist: {existing}")

          wheels = sorted(Path("dist").glob("*.whl"))
          if not wheels:
              raise SystemExit("Wheel was not built")

          with zipfile.ZipFile(wheels[-1]) as zf:
              entry_points = [name for name in zf.namelist() if name.endswith("entry_points.txt")]
              if entry_points:
                  text = zf.read(entry_points[0]).decode("utf-8")
                  for script_name in ("ies-online", "ies-lottool", "ies-fill-lots", "ies-web"):
                      if script_name in text:
                          raise SystemExit(
                              f"Legacy console script '{script_name}' still present in wheel metadata"
                          )
          PY

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
