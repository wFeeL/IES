[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ies-bot-skeleton"
version = "0.2.0"
description = "IES online/offline toolkit with compat layer and lot scoring."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
  "black>=24.0.0",
  "ruff>=0.5.0",
  "pytest>=8.0.0",
  "pre-commit>=3.7.0",
  "mypy>=1.10.0",
  "PyYAML>=6.0.0",
]

[project.scripts]
ies-online = "ies_bot_skeleton.entrypoints:ies_online"
ies-lottool = "ies_bot_skeleton.entrypoints:ies_lottool"
ies-fill-lots = "ies_bot_skeleton.entrypoints:ies_fill_lots"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = [".", "ies_bot_skeleton/lot_tool/src"]
include = ["ies_bot_skeleton*", "lottool*"]

[tool.setuptools.package-data]
ies_bot_skeleton = [
  "compat/*.yaml",
  "config/*.yaml",
  "lot_tool/config/*.json",
  "lot_tool/data/*.json",
  "lot_tool/data/lots/*.json",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["F"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
