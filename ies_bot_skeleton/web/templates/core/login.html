{% extends "base.html" %}
{% block title %}Вход | IES{% endblock %}
{% block content %}
<section class="grid place-items-center min-h-70">
  <div class="card w-full max-w-lg auth-card">
    <p class="section-kicker">Доступ в систему</p>
    <h1 class="h1">Вход в IES Lot Desk</h1>
    <p class="muted">Seed-учетки: `admin/admin123` и `analyst/analyst123`.</p>
    <form method="post" class="stack gap-4 mt-4">
      {{ form.hidden_tag() }}
      <input type="hidden" name="next" value="{{ next_target or '' }}" />
      <label class="label">{{ form.username.label }} {{ form.username(class_='input') }}</label>
      <label class="label">{{ form.password.label }} {{ form.password(class_='input') }}</label>
      <label class="inline">{{ form.remember() }} <span>Запомнить</span></label>
      <button class="btn btn-primary btn-block" type="submit">Войти</button>
    </form>
  </div>
</section>
{% endblock %}
