{% extends "base.html" %}
{% block title %}Login | IES{% endblock %}
{% block content %}
<section class="grid place-items-center min-h-70">
  <div class="card w-full max-w-lg">
    <h1 class="h1">Вход</h1>
    <p class="muted">Используйте seed-учетки: admin/admin123 или analyst/analyst123</p>
    <form method="post" class="stack gap-4 mt-4">
      {{ form.hidden_tag() }}
      <label class="label">{{ form.username.label }} {{ form.username(class_='input') }}</label>
      <label class="label">{{ form.password.label }} {{ form.password(class_='input') }}</label>
      <label class="inline">{{ form.remember() }} <span>Запомнить</span></label>
      <button class="btn btn-primary" type="submit">Войти</button>
    </form>
  </div>
</section>
{% endblock %}
